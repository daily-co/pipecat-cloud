[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pipecatcloud"
dynamic = ["version"]
requires-python = ">=3.11"
description = "Cloud hosting for Pipecat AI applications"
license = { text = "BSD 2-Clause License" }
readme = "README.md"
keywords = ["pipecat", "pipecat-ai", "voice", "ai", "llm"]
dependencies = [
    "aiohttp>=3.14.4,<4.0.0",
    "fastapi>=0.115.6,<1.0.0",
    "loguru~=0.7.3",
    "python-dotenv>=1.0.1,<2.0.0",
    "uvicorn>=0.32.0,<1.0.0",
    "typer>=0.20.0,<1",
    "synchronicity>=0.11,<1.0.0",
    "toml~=0.10.2",
    "questionary~=2.1.0",
    "pyyaml>=6.0,<7.0.0",
]

[project.optional-dependencies]
# The agent session-argument types (pipecatcloud.agent) subclass pipecat-ai's
# runner argument types. pipecat-ai is optional so the SDK and CLI surface stay
# lightweight — e.g. so the pipecat-base image doesn't pull pipecat-ai into its
# layer (the bot provides it). Floor is 1.0.0; `session_id` on the base
# RunnerArguments came later (v1.2.0) but is supplied by the SessionArguments
# mixin for pipecat-ai in [1.0.0, 1.2.0).
pipecat = ["pipecat-ai>=1.0.0"]


[dependency-groups]
dev = [
    "build~=1.4.0",
    "grpcio-tools~=1.78.0",
    "pre-commit~=4.5.1",
    "pyright>=1.1.404,<1.2",
    "pytest>=9.0.0,<10",
    "pytest-asyncio>=1.0.0,<2",
    "ruff>=0.12.11,<1",
    "setuptools>=84.1.0,<85",
    "setuptools_scm~=8.3.1",
    # Imported by the tests to compare pipecat-ai versions.
    "packaging>=25.0",
    # Needed to import/test pipecatcloud.agent (the optional pipecat surface).
    "pipecat-ai>=1.0.0",
    "towncrier~=25.8.0",
]

[project.entry-points."pipecat_cli.extensions"]
cloud = "pipecatcloud.cli.entry_point:entrypoint_cli_typer"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pipecatcloud*"]

[tool.setuptools.package-data]
pipecatcloud = ["py.typed"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "I", # Import rules
    "UP", # Modern Python
]

[tool.ruff.lint.per-file-ignores]
# Skip docstring checks for non-source code
"tests/**/*.py" = ["D"]
"scripts/**/*.py" = ["D"]
# Skip D104 (missing docstring in public package) for __init__.py files
"**/__init__.py" = ["D104"]

[project.urls]
Website = "https://docs.pipecat.ai/pipecat-cloud"

[tool.setuptools_scm]
local_scheme = "no-local-version"
fallback_version = "0.0.0-dev"

# Changelog fragments: each PR adds changelog/<PR>.<type>.md, and the
# generate-changelog workflow assembles them into CHANGELOG.md at release time.
[tool.towncrier]
name = "pipecatcloud"
filename = "CHANGELOG.md"
directory = "changelog"
start_string = "<!-- towncrier release notes start -->\n"
template = "changelog/_template.md.j2"
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/daily-co/pipecat-cloud/pull/{issue})"
underlines = ["", "", ""]
wrap = false

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "performance"
name = "Performance"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "other"
name = "Other"
showcontent = true
