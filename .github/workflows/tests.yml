name: tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

concurrency:
  group: build-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.typer == 'locked' && 'Unit Tests' || 'Unit Tests (latest supported Typer)' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typer: ['locked', 'latest-supported']
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync --frozen --group dev

      - name: Run tests with locked Typer
        if: matrix.typer == 'locked'
        run: |
          uv run --frozen --no-sync python -m pytest -v

      # A compatible --with requirement can reuse the locked Typer even with
      # --upgrade-package. Resolve a fresh exact version outside the lock first.
      - name: Run tests with newest supported Typer
        if: matrix.typer == 'latest-supported'
        run: |
          uv pip compile --python .venv/bin/python --no-deps --upgrade --resolution highest \
            --no-header --no-annotate --output-file "$RUNNER_TEMP/typer-latest.txt" - <<'REQUIREMENTS'
          typer>=0.20.0,<1
          REQUIREMENTS
          uv run --frozen --no-sync --with-requirements "$RUNNER_TEMP/typer-latest.txt" \
            python - "$RUNNER_TEMP/typer-latest.txt" <<'PY'
          import sys
          from importlib.metadata import version
          from pathlib import Path

          import pytest
          import typer

          installed = version("typer")
          print(f"Testing Typer {installed} from {typer.__file__}", flush=True)
          expected = Path(sys.argv[1]).read_text().strip()
          assert expected == f"typer=={installed}", "Installed Typer differs from resolved version"
          assert installed == typer.__version__, "Imported Typer differs from installed package"
          raise SystemExit(pytest.main(["-v"]))
          PY

  # The job above runs the agent session-argument types against the pipecat-ai
  # in uv.lock. These legs run them against releases before MOQRunnerArguments
  # gained relay_url, where pipecatcloud.agent must still import and refuse only
  # MOQSessionArguments: 1.11.0 has the class without the field, 1.5.0 has no
  # class at all.
  agent-types:
    name: 'Agent types on pipecat-ai ${{ matrix.pipecat-ai }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pipecat-ai: ['1.11.0', '1.5.0']
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync --group dev

      # `python -m pytest`: a bare `pytest` can resolve to the locked
      # environment's entry point instead of the layered one. The tests check,
      # in their own process, that they run on the version this leg names.
      - name: Run the agent type tests
        env:
          PCC_EXPECTED_PIPECAT_AI: ${{ matrix.pipecat-ai }}
        run: |
          uv run --with "pipecat-ai==${{ matrix.pipecat-ai }}" python -m pytest -v tests/test_agent_args.py
